[package]
name = "mode_u_engine"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Database Research Team"]
description = "Clean production engine for Conformal Query Processing (CQP / Mode U)"

[lib]
name = "mode_u_engine"
path = "src/lib.rs"

[[bin]]
name = "benchmark_flat_conformal"
path = "src/bin/benchmark_flat_conformal.rs"

[[bin]]
name = "benchmark_nested_conformal"
path = "src/bin/benchmark_nested_conformal.rs"

[[bin]]
name = "benchmark_tpch_q3"
path = "src/bin/benchmark_tpch_q3.rs"

[[bin]]
name = "benchmark_tpch_q10"
path = "src/bin/benchmark_tpch_q10.rs"

[[bin]]
name = "calibrate_flat_strategies"
path = "src/bin/calibrate_flat_strategies.rs"

[[bin]]
name = "calibrate_nested_strategies"
path = "src/bin/calibrate_nested_strategies.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
ordered-float = { version = "4", features = ["serde"] }
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
rustc-hash = "2.1"
lazy_static = "1.4"
zmq = "0.10"
rand = { version = "0.8", features = ["small_rng"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "io-util"] }
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
